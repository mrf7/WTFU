[versions]
## SDK Versions
lifecycleViewmodel = "2.10.0"
material3 = "1.4.0"
minSdk = "29"
nav3Core = "1.1.2"
lifecycleViewmodelNav3 = "2.10.0"
targetSdk = "36"
compileSdk = "36"

# Dependencies
kotlin = "2.3.21"

android-gradle-plugin = "9.0.0"

compose = "1.11.2"
material-icons = "1.7.8"

android-desugaring = "2.1.5"
androidx-core = "1.17.0"
androidx-test-junit = "1.3.0"
androidx-activity-compose = "1.12.0"
androidx-lifecycle = "2.10.0"

junit = "4.13.2"

coroutines = "1.10.2"
kotlinx-datetime = "0.7.1"
kotlinx-serialization = "1.8.1"

kermit = "2.0.8"
skie = "0.10.11"

koin = "4.2.1"
turbine = "1.2.0"
kotest = "6.1.7"
kotest-plugin = "6.1.11"
ksp = "2.3.6"
sqlDelight = "2.3.2"
uiToolingPreview = "1.11.2"
uiTooling = "1.11.2"

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-icons" }
androidx-test-junit = { module = "androidx.test.ext:junit-ktx", version.ref = "androidx-test-junit" }

compose-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "uiToolingPreview" }
